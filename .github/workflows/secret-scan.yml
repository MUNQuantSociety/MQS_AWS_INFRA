name: secret-scan

# Server-side credential guard. The .githooks/pre-commit hook is the fast local
# check, but hooks are per-clone and skippable with --no-verify; this runs where
# the committer cannot turn it off.
#
# Scope: the FULL history on every run (fetch-depth: 0), not just the pushed
# range. A secret introduced in an earlier commit and rebased forward stays
# findable, and a force-push cannot quietly launder it out of the scan.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so a credential pattern added to gitleaks after our last push
    # still gets applied to the existing history.
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forbidden-paths:
    # Cheap, dependency-free, and catches the exact failure mode that matters
    # most: a credential-bearing file that got force-added past .gitignore.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject tracked credential files
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -Ev '\.example($|\.)' | grep -E \
            -e '(^|/)\.env($|\.)' \
            -e '\.env$' \
            -e '\.tfvars$' \
            -e '\.tfvars\.json$' \
            -e '\.tfstate' \
            -e '\.tfplan' \
            -e '\.(pem|key|p12|pfx|jks|keystore|ppk)$' \
            -e 'accessKeys?.*\.csv$' \
            -e '(^|/)credentials(\.csv)?$' \
            -e '(^|/)\.terraformrc$' \
            || true)
          if [ -n "$bad" ]; then
            echo "::error::Credential-shaped files are tracked in a PUBLIC repo:"
            echo "$bad" | sed 's/^/  /'
            echo "Remove them from the index, then ROTATE the credentials -- they are already published."
            exit 1
          fi
          echo "No credential-shaped paths tracked."

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          # Resolved at run time rather than pinned so a stale pin cannot make
          # the job fail closed on a 404 and get disabled out of annoyance.
          tag=$(curl -fsSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest | jq -r .tag_name)
          ver=${tag#v}
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/${tag}/gitleaks_${ver}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full history
        # --redact: findings are printed without the secret value, so a public
        # Actions log does not become the second place the credential leaks.
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose

      - name: Scan the working tree
        # `detect` reads commits; `dir` reads files on disk, which also covers
        # anything staged-but-uncommitted in a workflow that writes files.
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner
