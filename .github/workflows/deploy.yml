name: Build and deploy MQSMaster to ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: mqsmaster
  ECS_CLUSTER: mqsmaster-prod-cluster
  MARKET_TASK_FAMILY: mqsmaster-prod
  MARKET_CONTAINER_NAME: mqsmaster
  NLP_TASK_FAMILY: mqsmaster-prod-nlp
  NLP_CONTAINER_NAME: mqsmaster-nlp
  NLP_SERVICE_NAME: mqsmaster-prod-nlp

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Expects this workflow to live INSIDE the MQSMaster repo (Dockerfile at repo root).
    # If MQSMaster lives in a different repo from this Terraform code, copy this file
    # to that repo's .github/workflows/ directory.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: vars
        run: echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          TAG: ${{ steps.vars.outputs.image_tag }}
        run: |
          set -euo pipefail
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}:${TAG}"
          docker build -t "${IMAGE_URI}" -t "${REGISTRY}/${ECR_REPOSITORY}:latest" .
          docker push "${IMAGE_URI}"
          docker push "${REGISTRY}/${ECR_REPOSITORY}:latest"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      # --- Market task: register new revision; EventBridge target points at the
      # --- family (unpinned revision), so the next scheduled run picks it up.
      - name: Download market task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${MARKET_TASK_FAMILY}" \
            --query 'taskDefinition' \
            > market-task-def.json

      - name: Render market task definition
        id: render-market
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: market-task-def.json
          container-name: ${{ env.MARKET_CONTAINER_NAME }}
          image: ${{ steps.build.outputs.image_uri }}

      - name: Register market task revision
        run: |
          aws ecs register-task-definition \
            --cli-input-json file://${{ steps.render-market.outputs.task-definition }} \
            > /dev/null
          echo "Registered new revision for ${MARKET_TASK_FAMILY}"

      # --- NLP service: register new revision AND update the service so the
      # --- always-on task restarts onto the new image.
      - name: Download NLP task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${NLP_TASK_FAMILY}" \
            --query 'taskDefinition' \
            > nlp-task-def.json

      - name: Render NLP task definition
        id: render-nlp
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: nlp-task-def.json
          container-name: ${{ env.NLP_CONTAINER_NAME }}
          image: ${{ steps.build.outputs.image_uri }}

      - name: Deploy NLP service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-nlp.outputs.task-definition }}
          service: ${{ env.NLP_SERVICE_NAME }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Done
        run: echo "Deployed image ${{ steps.build.outputs.image_uri }}"
